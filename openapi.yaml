openapi: 3.1.0

# ---------------------------------------------------------------------------
# Settla — public API contract.
#
# STATUS: /v1 is live. Operations marked `x-settla-status: live` answer on the
# running service today; `proposed` operations are contract-only and answer
# 501. The service's own declaration of its surface is GET /v1 — where this
# file and a running answer disagree, the running answer wins. See README.md.
# ---------------------------------------------------------------------------

info:
  title: Settla API
  version: "2026-08-17"
  summary: Programmatic payments where a human BankID signature is the final word.
  description: |
    Settla never holds money. A payment is placed at the payer's own bank and
    settles from their account to the recipient's; no API call can create a
    Settla balance.

    An API key cannot sign. A key prepares — places a payment, opens a bank
    connection — and every preparation ends in a BankID signature by a named
    human in their own BankID app. Endpoints marked `signed` in GET /v1 return
    a SIGNING ORDER (a QR and an autostart token) for you to show, and one
    route to poll for the result.

    Read `x-settla-status` on every operation before integrating. `live` means
    it answers today. `proposed` means the contract is published for comment
    and the operation answers 501.
  contact:
    name: Settla
    url: https://github.com/Authenticate-eID-Sweden-AB/settla-api
  license:
    name: Contract published for comment; see README

servers:
  - url: https://test.settla.se
    description: |
      The running service. It is a test host, it will change; do not hard-code
      it.

tags:
  - name: Discovery
    description: What the API can do, from the API itself. No key needed.
  - name: Account
    description: The account behind the key, and its API keys.
  - name: Banks
    description: Connecting banks and reading accounts, balances and transactions.
  - name: Payments
    description: Place payments for a human to sign, follow them, withdraw unsigned ones.
  - name: Signing orders
    description: The BankID orders behind every `signed` endpoint.
  - name: Payment requests
    description: Ask someone for money. The payer needs no Settla account.
  - name: Contacts
    description: |
      Who this account already deals with. Not a directory — Settla's register
      of its own users is deliberately unreachable with a key.
  - name: Documents
    description: Documents sent for signature, and their BankID evidence.
  - name: Events
    description: Being told, rather than asking.
  - name: Verification
    description: Public, unauthenticated. Holding the file is the entitlement.
  - name: Checkout
    description: Hosted checkout for merchants. Proposed.

security:
  - ApiKey: []

paths:
  # -------------------------------------------------------------- discovery
  /v1:
    get:
      tags: [Discovery]
      operationId: getCapabilities
      x-settla-status: live
      summary: Every capability, each marked read, act or signed
      description: |
        Unauthenticated on purpose: somebody deciding whether to build against
        this should be able to read what it does before they have an account.
        A declared capability that is not built yet answers 501 when called —
        a roadmap, not a bug.
      security: []
      responses:
        "200":
          description: The capability list and the signing rule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: {type: string, const: settla}
                  version: {type: string, const: v1}
                  signing: {type: string}
                  capabilities:
                    type: array
                    items: {$ref: "#/components/schemas/Capability"}

  /v1/me:
    get:
      tags: [Account]
      operationId: getMe
      x-settla-status: live
      summary: The account behind this key
      description: |
        Deliberately not the personal number. A key is often held by a script
        on a server that has no business holding one; the name and username
        say which account you are talking to.
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  username: {type: [string, "null"]}
                  email: {type: [string, "null"]}
                  onboarding:
                    type: object
                    properties:
                      complete: {type: boolean, const: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/NotOnboarded"}

  # ------------------------------------------------------------------ banks
  /v1/banks:
    get:
      tags: [Banks]
      operationId: listBanks
      x-settla-status: live
      summary: Banks that can be connected and paid from
      description: |
        `ais` and `pis` are separate answers on purpose: a bank can be readable
        but not payable. Both mean proven-and-current, not merely "an adapter
        exists" — a bank that cannot take a payment today is not offered as
        though it could.
      responses:
        "200":
          description: The banks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  banks:
                    type: array
                    items: {$ref: "#/components/schemas/Bank"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/bank-connections:
    get:
      tags: [Banks]
      operationId: listBankConnections
      x-settla-status: live
      summary: Connected banks, and how long each consent has left
      description: |
        A local read of the grant store — no bank call — so a timer may poll
        it. Each row carries `days_left` and a `state` of `ok`, `expiring` or
        `lapsed`. Bank consents last 90–180 days; renew a lapsing one with
        POST /v1/bank-connections before it stops answering, rather than
        discovering the lapse at the next read.
      responses:
        "200":
          description: The connected banks, worst-first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        bank: {type: string, description: "Bank id, e.g. `nordea`."}
                        bank_name: {type: string}
                        state: {type: string, enum: [ok, expiring, lapsed]}
                        expires_at: {type: string, format: date-time, nullable: true}
                        days_left: {type: integer}
                        estimated:
                          type: boolean
                          description: True when the date is our policy, not the bank's own word (every bank but Nordea).
                        revocable_at_bank:
                          type: boolean
                          description: Whether disconnecting reaches the bank or only us.
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [Banks]
      operationId: connectBank
      x-settla-status: live
      summary: Connect a bank (or renew a lapsing one) — returns a signing order
      description: |
        Raises the bank's own BankID order. Show the returned QR, or on the
        device that holds the BankID app pass `same_device: true` and launch
        the autostart token. Poll the order; on completion it carries the
        connected accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank]
              properties:
                bank:
                  type: string
                  description: A bank id from GET /v1/banks, e.g. `nordea`.
                same_device:
                  type: boolean
                  default: false
                  description: |
                    The person is on the device that holds their BankID app.
                    Some banks fix the signing mode when the order is raised —
                    an order raised for a QR never yields an autostart token,
                    so this cannot be corrected afterwards.
                user_ip:
                  type: string
                  description: The person's own IP, where your system honestly knows it.
      responses:
        "201":
          description: A pending signing order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SigningOrderEnvelope"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503":
          description: The bank cannot be connected right now; the message says why.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /v1/bank-connections/{bank}/disconnect:
    post:
      tags: [Banks]
      operationId: disconnectBank
      x-settla-status: live
      summary: Disconnect a bank
      description: |
        Withdraws the consent at the bank where the bank supports it, and
        forgets it here so no lapse reminder fires for a connection the person
        ended on purpose. `at_bank` says what reached the bank (`withdrawn`,
        `not_supported` or `failed`).
      parameters:
        - name: bank
          in: path
          required: true
          schema: {type: string}
          description: A connected bank id from GET /v1/bank-connections.
      responses:
        "200":
          description: The outcome of the disconnect.
          content:
            application/json:
              schema:
                type: object
                properties:
                  disconnected: {type: boolean}
                  at_bank: {type: string, enum: [withdrawn, not_supported, failed]}
                  reason: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/accounts:
    get:
      tags: [Banks]
      operationId: listAccounts
      x-settla-status: live
      summary: Every account at every connected bank, with balances
      description: |
        One call, whatever banks the person has connected — the caller never
        names a bank. A bank that fails is reported in its row, never omitted:
        an overview that quietly drops a bank tells somebody they have less
        money than they do.

        `?refresh=false` answers from the last poll without touching the
        banks. Use it for anything on a timer: live balance reads are counted
        against daily ceilings at some banks.
      parameters:
        - name: refresh
          in: query
          required: false
          schema: {type: string, enum: ["true", "false"], default: "true"}
        - $ref: "#/components/parameters/UserIp"
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountsOverview"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/accounts/{id}/transactions:
    get:
      tags: [Banks]
      operationId: listTransactions
      x-settla-status: live
      summary: Transactions for one account
      description: |
        From the service's own ledger — the year backfilled when the account
        was first seen, and everything the scheduled polling has added since.
        No bank round trip, so poll freely.
      parameters:
        - name: id
          in: path
          required: true
          description: An account id (or account number) from GET /v1/accounts.
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
      responses:
        "200":
          description: The transactions, newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TransactionsAnswer"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ----------------------------------------------------------------- payments
  /v1/payments:
    post:
      tags: [Payments]
      operationId: placePayment
      x-settla-status: live
      summary: Place one payment — returns a signing order
      description: |
        The payment is placed at the payer's bank and the bank's own BankID
        signing order is opened. Nothing has moved when this returns — the
        payment is unsigned and still cancellable — but the person's next
        action in their BankID app is irrevocable, so the amount, recipient
        and source shown to them are the ones sent here.

        The bank is resolved from `from_account`; naming `bank` explicitly is
        allowed and settles ambiguity.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PaymentPlace"}
      responses:
        "201":
          description: A pending signing order. Poll it; the QR rotates.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SigningOrderEnvelope"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: |
            `bank_connection_expired` — the connection behind `from_account`
            has lapsed. Reconnect with POST /v1/bank-connections and place the
            payment again.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: |
            `bank_refused` — the bank refused the placement. The message is
            the bank's own reason, passed through.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: Payments from this bank are not available; the message says why.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    get:
      tags: [Payments]
      operationId: listPayments
      x-settla-status: live
      summary: Payments placed through Settla, with the bank's own status
      description: |
        Merged across every connected bank, newest first. `label` and `detail`
        are human-readable words about what the bank has said — they never say
        "settled" or "paid"; that conclusion belongs to the recipient's bank
        statement.
      responses:
        "200":
          description: The payments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items: {$ref: "#/components/schemas/Payment"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/payments/{id}:
    get:
      tags: [Payments]
      operationId: getPayment
      x-settla-status: live
      summary: One payment, by the id from the payments list
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: {$ref: "#/components/schemas/Payment"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/payments/{orderId}/cancel:
    post:
      tags: [Payments]
      operationId: cancelPayment
      x-settla-status: live
      summary: Withdraw an unsigned payment, by its order id
      description: |
        Only an unsigned payment can be withdrawn, and the order from POST
        /v1/payments is what identifies one. An abandoned attempt withdrawn
        here leaves nothing behind at the bank.
      parameters:
        - name: orderId
          in: path
          required: true
          description: The `order.id` returned when the payment was placed.
          schema: {type: string}
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: {type: boolean}
                  reason: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/payments/batch:
    post:
      tags: [Payments]
      operationId: placeBatch
      x-settla-status: proposed
      summary: Several payments under one signature
      description: |
        Proposed, and bank-dependent by nature: not every bank offers a basket
        a single signature can cover, and the service refuses combinations the
        bank cannot honour rather than letting them die after placement.
      responses:
        "501": {$ref: "#/components/responses/NotImplemented"}

  # ------------------------------------------------------------ signing orders
  /v1/orders:
    get:
      tags: [Signing orders]
      operationId: listOrders
      x-settla-status: live
      summary: Signing orders in flight
      description: |
        The orders this process is holding right now, for this key's account.
        Orders are minutes-long and held in memory, so this is a window into
        what is signing — not a durable ledger. For history, read /v1/payments
        and /v1/bank-connections. After a restart the list is empty.
      responses:
        "200":
          description: The in-flight orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        kind: {type: string, enum: [bank_connection, payment]}
                        bank: {type: string}
                        created_at: {type: string, format: date-time}
                        poll: {type: string, description: "The route to poll, /v1/orders/{id}."}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/orders/{id}:
    get:
      tags: [Signing orders]
      operationId: pollOrder
      x-settla-status: live
      summary: Poll a signing order
      description: |
        While `pending`, every answer carries the freshest QR and autostart
        token — the QR rotates about once a second, so render what the latest
        poll returns. On completion a payment order carries the payment's
        outcome; a bank-connection order carries the connected accounts.

        Orders are minutes-long and held in memory: after a service restart an
        order answers 404. Place again — the idempotency key resolves to the
        payment that already exists.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The order's state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SigningOrderEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ---------------------------------------------------------- payment requests
  /v1/payment-requests:
    post:
      tags: [Payment requests]
      operationId: createPaymentRequest
      x-settla-status: live
      summary: Ask one or more people to pay; returns and mails a link per payer
      description: |
        A request records what was asked; it moves no money. Each participant
        gets their own link — the link is the whole relationship, and the
        payer needs no Settla account to use it. Participants with an email
        are mailed their link; any that could not be mailed are listed in
        `unsent`, with the links in the response so your system can deliver
        them itself.

        Money asked for lands on the requester's payout account as it stands
        when each share is paid — not as it stood when the request was made.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [total, people]
              properties:
                kind:
                  type: string
                  enum: [single, group]
                  default: single
                  description: |
                    `group` splits the total evenly, remainder distributed an
                    öre at a time rather than dropped.
                total: {$ref: "#/components/schemas/Amount"}
                message: {type: string, maxLength: 200}
                people:
                  type: array
                  minItems: 1
                  maxItems: 50
                  description: |
                    One entry per person asked. A string containing `@` is an
                    email; any other string is a name. Objects with `name`
                    and/or `email` are also accepted.
                  items:
                    oneOf:
                      - type: string
                      - type: object
                        properties:
                          name: {type: string}
                          email: {type: string, format: email}
      responses:
        "201":
          description: The request, with each participant's link.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentRequest"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: The request could not be created; the message says why.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    get:
      tags: [Payment requests]
      operationId: listPaymentRequests
      x-settla-status: live
      summary: Requests sent, and who has paid
      responses:
        "200":
          description: The requests, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: {$ref: "#/components/schemas/PaymentRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/payment-requests/{id}:
    get:
      tags: [Payment requests]
      operationId: getPaymentRequest
      x-settla-status: live
      summary: One payment request
      description: |
        The request, its participants, their pay links and who has paid.
        Readable only by the account that raised it; another account's id is a
        404, never a 403 — an answer that told them apart would confirm the id.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: {$ref: "#/components/schemas/PaymentRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/payment-requests/{id}/cancel:
    post:
      tags: [Payment requests]
      operationId: cancelPaymentRequest
      x-settla-status: live
      summary: Withdraw a request
      description: |
        Cancelling stops what has not happened; it does not unwind what has.
        Participants who already paid keep their record, and the link stops
        working for the rest.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Withdrawn.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: {type: boolean, const: true}
                  id: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ------------------------------------------------------------------ contacts
  /v1/contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      x-settla-status: live
      summary: Who this account pays, asks and sends documents to
      description: |
        The account's own contact book, in the same merged shape the portal
        renders: what Settla has learned from payments, requests and documents
        on this account, folded together with the frequent counterparties mined
        from the account holder's own bank history.

        Nothing here is a directory. Every entry is a counterparty this account
        has already dealt with, and Settla's register of its own users is
        deliberately not reachable through an API key: the search budget that
        protects it is per person, and a key is exactly what would multiply what
        that budget caps.

        No personnummer appears in the response, because none is stored. A
        contact who is themselves a Settla user is held as a reference to their
        account, and their current name and payout are resolved when they are
        paid — so a saved contact pays the account somebody has now, not the one
        they had when you saved them.
      responses:
        "200":
          description: The book, most-paid first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items: {$ref: "#/components/schemas/Contact"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/contacts/import:
    post:
      tags: [Contacts]
      operationId: importContacts
      x-settla-status: live
      summary: Import an address book into this account's own contact book
      description: |
        Built for the Settla app, which offers the import once the person has
        linked a personnummer to their phone number.

        Idempotent on the phone number: re-sending the same address book updates
        rather than duplicates. Numbers are normalised to E.164 on the way in,
        because a number held in two shapes matches in neither — and a bare
        number with no `+` and no leading zero is discarded rather than assumed
        Swedish, since guessing a country code invents a different real person's
        number. A row with neither a phone nor an address is skipped: a name on
        its own is not a contact.

        At most 2000 entries per call. Over that is refused rather than
        truncated — importing the first 2000 of somebody's contacts and
        answering 200 is a half-success discovered a month later.

        This is the one place on this API that writes other people's details.
        The imported contacts are held per account and never pooled between
        accounts, and nothing is ever sent to the people in the imported book.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contacts]
              properties:
                contacts:
                  type: array
                  maxItems: 2000
                  items:
                    type: object
                    properties:
                      name: {type: string, maxLength: 70}
                      phone: {type: string, description: Any readable form; normalised to E.164.}
                      email: {type: string, format: email}
      responses:
        "200":
          description: What the import did.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: {type: integer, description: Contacts that did not exist before.}
                  updated: {type: integer, description: Contacts already known, matched on phone or address.}
                  skipped: {type: integer, description: Rows with no usable way to reach anybody.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  # ----------------------------------------------------------------- documents
  /v1/documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      x-settla-status: live
      summary: Documents sent for signature, with signing state
      responses:
        "200":
          description: The documents, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items: {$ref: "#/components/schemas/DocumentSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [Documents]
      operationId: createDocument
      x-settla-status: proposed
      summary: Upload a document and name its signatories
      description: Proposed. Until it is built, documents are sent from the portal.
      responses:
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/documents/{id}:
    get:
      tags: [Documents]
      operationId: getDocument
      x-settla-status: live
      summary: One document
      description: |
        The document and its signing state. Readable only by the account that
        sent it; another sender's id is a 404. For the sealed file and its
        signature evidence, use /v1/documents/{id}/evidence.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: {$ref: "#/components/schemas/DocumentSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/documents/{id}/sign:
    post:
      tags: [Documents]
      operationId: signDocument
      x-settla-status: proposed
      summary: Sign a document — returns a BankID order
      responses:
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/documents/{id}/evidence:
    get:
      tags: [Documents]
      operationId: getDocumentEvidence
      x-settla-status: live
      summary: The BankID evidence for a document you sent
      description: |
        The same material as the public verifier's evidence bundle, under a
        different entitlement: there, holding the file proves the right to
        read; here, being the document's sender does.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The evidence.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EvidenceBundle"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ------------------------------------------------------------------ the keys
  /v1/api-keys:
    get:
      tags: [Account]
      operationId: listApiKeys
      x-settla-status: live
      summary: This account's keys. Never the secrets.
      description: |
        A key can see its siblings and never a secret — the record has no
        field for one. Enumerating and revoking from code is what makes
        rotation automatable, which is what makes it happen.
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: {$ref: "#/components/schemas/ApiKey"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/api-keys/{id}/revoke:
    post:
      tags: [Account]
      operationId: revokeApiKey
      x-settla-status: live
      summary: Kill a key immediately
      description: |
        A key revoking itself is allowed and is the correct response to a
        leak: the next call with it fails, including this one's caller.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: "^[0-9a-f]{16}$"}
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: {type: boolean, const: true}
                  id: {type: string}
                  self: {type: boolean, description: Whether the key revoked itself.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ------------------------------------------------------------------- events
  /v1/events:
    get:
      tags: [Events]
      operationId: streamEvents
      x-settla-status: live
      summary: A held-open stream of nudges about this account
      description: |
        Server-Sent Events. An event says *look again* — a topic and a short
        reason, never the state itself. A client that missed events while
        disconnected re-reads the resources on reconnect and is correct again.
        Nothing personal travels on the stream.
      responses:
        "200":
          description: "`text/event-stream`. Held open; keep-alive pings arrive on a timer."
        "401": {$ref: "#/components/responses/Unauthorized"}

  # ----------------------------------------------------------------- checkout
  /v1/checkout/sessions:
    post:
      tags: [Checkout]
      operationId: createCheckoutSession
      x-settla-status: proposed
      summary: Hand a customer to Settla's hosted checkout and get them back
      responses:
        "501": {$ref: "#/components/responses/NotImplemented"}

  # ------------------------------------------------------------- verification
  /api/verify:
    post:
      tags: [Verification]
      operationId: verifyDocument
      x-settla-status: live
      summary: Check whether a PDF is a document Settla holds signatures for
      description: |
        Send the file itself. It is hashed and the hash is looked up; the file is
        not stored. Matching is on the exact bytes, so a re-export or a single
        changed space produces a different hash and no match.

        No authentication. Rate limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/pdf:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: |
            Answered. Note that a file Settla does not recognise is a 200 with
            `known: false`, not a 404 — the question was answered.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VerificationMiss"
                  - $ref: "#/components/schemas/VerificationHit"
        "400": {$ref: "#/components/responses/BadRequest"}
        "413":
          description: The file is larger than the verifier accepts.
        "429": {$ref: "#/components/responses/RateLimited"}

  /api/verify/evidence/{sha256}:
    get:
      tags: [Verification]
      operationId: getEvidenceBundle
      x-settla-status: live
      summary: Download the raw BankID evidence for a document
      description: |
        The material behind a verification result, so it can be checked with
        your own tools instead of believing this service: each signer's XMLDSig,
        the signed manifest, and the OCSP response captured at signing time.

        Keyed on the document hash, so you must hold the file to ask.
      security: []
      parameters:
        - name: sha256
          in: path
          required: true
          description: SHA-256 of the document, lowercase hex.
          schema: {type: string, pattern: "^[0-9a-f]{64}$"}
      responses:
        "200":
          description: The evidence bundle.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EvidenceBundle"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404":
          description: No document with that hash.

# ---------------------------------------------------------------------- hooks
webhooks:
  paymentSigned:
    post:
      x-settla-status: proposed
      summary: A person signed a payment. Proposed — poll /v1/orders or hold /v1/events open instead.
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebhookEvent"}
      responses:
        "200": {description: Acknowledged. Anything else is retried.}

components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: settla_sk_…
      description: |
        Created in the Settla portal under Profil and shown exactly once —
        only an HMAC is stored, so there is no "show again". A key acts for
        exactly one account and sees nothing outside it. A key cannot sign:
        everything it places waits for a human BankID signature.

        `Authorization: Bearer settla_sk_…` is the only accepted form. A key
        in a query string is rejected — query strings reach access logs,
        browser history and referrer headers.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Replaying the same key resolves to the payment that already exists at
        the bank instead of placing a second one. Optional because a safe one
        is derived from what the payment IS when the header is absent — but an
        agent's retry loop should send its own.
      schema: {type: string, maxLength: 64}
    UserIp:
      name: X-User-Ip
      in: header
      required: false
      description: |
        The person's own IP, where your system honestly knows it. It travels
        to the bank as the PSU address; some banks meter reads differently
        without it.
      schema: {type: string}

  responses:
    BadRequest:
      description: The request could not be accepted; the message names the field and the way out.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: |
        Missing, malformed, unknown or revoked key. Deliberately one
        indistinguishable answer: which half of a guess was right is not told.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotOnboarded:
      description: |
        `not_onboarded` — the account behind the key has fallen out of the
        onboarding gate (a lapsed bank connection, an unverified email). The
        gate is re-checked on every call, not trusted from mint time.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: |
        No such resource, or it does not belong to this account — the two are
        deliberately the same answer.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotImplemented:
      description: |
        `not_implemented` — declared at GET /v1 and not built yet. A roadmap,
        not a bug.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: Too many attempts from this address. Retry after the header says so.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, description: Stable and machine-readable.}
            message:
              type: string
              description: |
                For a developer's console, in English — except where a bank's
                own refusal is passed through, which arrives as the bank gave
                it.
            docs: {type: string, format: uri}

    Capability:
      type: object
      required: [method, path, kind, summary]
      properties:
        method: {type: string, enum: [GET, POST]}
        path: {type: string, examples: ["/v1/payments"]}
        kind:
          type: string
          enum: [read, act, signed]
          description: |
            `read` answers immediately. `act` changes something that is
            Settla's to change, immediately. `signed` returns a signing order
            a human completes in BankID.
        summary: {type: string}

    Amount:
      type: string
      pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
      description: |
        A decimal string, dot decimal, at most two places — never a float,
        never öre as an integer. A JSON number is accepted on input but is
        refused, not rounded, if it does not survive two decimals.
      examples: ["7031.00", "250"]

    Bank:
      type: object
      required: [id, name]
      properties:
        id: {type: string, description: What every call that names a bank must carry., examples: [nordea]}
        name: {type: string, examples: [Nordea]}
        ais: {type: boolean, description: Can be connected and read today.}
        pis: {type: boolean, description: A payment has actually been executed through this bank.}
        aisNote: {type: string, description: Why not, when `ais` is false. Swedish, as the bank module gives it.}
        pisNote: {type: string, description: Why not, when `pis` is false.}

    AccountsOverview:
      type: object
      properties:
        read_at: {type: string, format: date-time}
        banks:
          type: array
          items:
            type: object
            required: [bank, connected]
            properties:
              bank: {type: string}
              name: {type: string}
              connected: {type: boolean}
              expired: {type: boolean, description: The consent has lapsed; reconnect to read again.}
              failed: {type: boolean, description: The bank answered badly. The row is reported, never dropped.}
              message: {type: [string, "null"]}
              complete: {type: boolean, description: Whether every balance figure came back.}
              consent_expires_at: {type: [string, "null"], format: date-time}
              accounts:
                type: array
                items: {$ref: "#/components/schemas/Account"}

    Account:
      type: object
      required: [id, number, currency]
      properties:
        id: {type: string}
        number: {type: string, description: IBAN or BBAN as the bank reported it.}
        name: {type: [string, "null"], description: The bank's own label ("Privatkonto").}
        currency: {type: string}
        balance:
          type: [number, "null"]
          description: Null when no poll has observed the account — never 0.
        balance_observed_at: {type: [string, "null"], format: date-time}

    TransactionsAnswer:
      type: object
      properties:
        account:
          type: object
          properties:
            id: {type: string}
            number: {type: string}
            currency: {type: string}
            bank: {type: string}
        updated_at: {type: [string, "null"], format: date-time}
        transactions:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              amount: {type: number}
              currency: {type: string}
              booking_date: {type: [string, "null"]}
              value_date: {type: [string, "null"]}
              narrative: {type: [string, "null"]}
              counterparty: {type: [string, "null"]}
              counterparty_account: {type: [string, "null"]}
              reference: {type: [string, "null"]}
              message: {type: [string, "null"]}
              type: {type: [string, "null"]}
              balance_after: {type: [number, "null"]}
              status: {type: [string, "null"]}

    PaymentPlace:
      type: object
      required: [from_account, to_account, creditor_name, amount]
      properties:
        from_account:
          type: string
          description: One of the person's own accounts, from GET /v1/accounts.
        to_account:
          type: string
          description: An IBAN, or a giro number with `to_account_type` set.
        to_account_type:
          type: string
          enum: [IBAN, BGNR, PGNR]
          description: |
            Required for giro numbers: the service refuses to guess between
            the bankgiro and plusgiro registers.
        creditor_name:
          type: string
          maxLength: 70
          description: Required — the bank shows the signer who is being paid.
        amount: {$ref: "#/components/schemas/Amount"}
        reference:
          type: string
          pattern: "^[0-9]{2,25}$"
          description: An OCR number. Free text goes in `message`.
        message: {type: string, maxLength: 140}
        bank:
          type: string
          description: Optional — resolved from `from_account` when absent.
        same_device: {type: boolean, default: false}
        user_ip: {type: string}

    Payment:
      type: object
      required: [id, bank, amount, currency, status]
      properties:
        id: {type: string}
        bank: {type: string}
        amount: {type: number}
        currency: {type: string}
        to_account: {type: string}
        creditor_name: {type: [string, "null"]}
        reference: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        status: {type: string, description: The service's own status word for the payment's stage.}
        label:
          type: [string, "null"]
          description: |
            What to show a person, in Swedish. Deliberately never "settled" or
            "paid" — a signed payment can still be reversed before clearing,
            and that conclusion is the recipient's to draw.
        detail: {type: [string, "null"]}
        signed: {type: boolean}
        final: {type: boolean, description: Whether the bank's answer can still change.}

    SigningOrderEnvelope:
      type: object
      required: [order]
      properties:
        order:
          type: object
          required: [id, kind, status]
          properties:
            id: {type: string, examples: ["ord_9f2c66d1a03b71e4c8d20a55"]}
            kind: {type: string, enum: [payment, bank_connection]}
            bank: {type: string}
            status: {type: string, enum: [pending, completed, failed, expired]}
            qr_data:
              type: [string, "null"]
              description: |
                The string to render as a BankID QR. Rotates about once a
                second — render what the latest poll returns.
            qr_image:
              type: [string, "null"]
              description: |
                Some banks send a finished PNG (base64) instead of a string to
                encode, and for those it is the ONLY thing sent. Prefer it
                when present.
            autostart_token:
              type: [string, "null"]
              description: |
                For the device that holds the BankID app: launch
                `bankid:///?autostarttoken=…&redirect=null`. Rotates at some
                banks — the freshest wins.
            signature:
              type: object
              description: |
                Which signature of how many is in front of the person — some
                banks approve the recipient first, then the money.
              properties:
                ordinal: {type: integer}
                purpose: {type: string}
            poll: {type: string, description: The route to poll., examples: ["/v1/orders/ord_…"]}
            reason: {type: [string, "null"], description: Why, when failed or expired.}
            payment:
              type: object
              description: On a completed payment order — the outcome, in the bank's words.
              properties:
                id: {type: string, description: The payment's id in GET /v1/payments.}
                status: {type: string}
                bank_status: {type: string, description: The bank's own status code, as given.}
                label: {type: [string, "null"]}
                detail: {type: [string, "null"]}
                signed: {type: boolean}
            bank_connection:
              type: object
              description: On a completed bank-connection order.
              properties:
                bank: {type: string}
                consent_expires_at: {type: string, format: date-time}
                accounts:
                  type: array
                  items: {$ref: "#/components/schemas/Account"}

    PaymentRequest:
      type: object
      required: [id, kind, total, currency, participants]
      properties:
        id: {type: string}
        kind: {type: string, enum: [single, group]}
        total: {$ref: "#/components/schemas/Amount"}
        currency: {type: string, const: SEK}
        message: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        cancelled_at: {type: [string, "null"], format: date-time}
        settled: {type: boolean, description: Every participant has paid or declined.}
        outstanding: {$ref: "#/components/schemas/Amount"}
        participants:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: [string, "null"]}
              email: {type: [string, "null"]}
              amount: {$ref: "#/components/schemas/Amount"}
              status: {type: string, enum: [pending, paid, declined]}
              paid_at: {type: [string, "null"], format: date-time}
              url:
                type: string
                format: uri
                description: |
                  This participant's own link — the whole relationship. Not
                  shared between participants, so who has paid stays tellable.
        unsent:
          type: array
          items: {type: string, format: email}
          description: |
            Participants whose link could not be mailed. Their links are in
            `participants[].url`; deliver them yourself.

    Contact:
      type: object
      description: One counterparty and every way this account can reach them.
      properties:
        name:
          type: [string, "null"]
          description: What Settla shows for them; null when nothing has named them yet.
        name_source:
          type: [string, "null"]
          enum: [user, settla, giro-register, bank, platform, null]
          description: |
            Where the name came from, in the order it is trusted. `user` is the
            account holder's own label and outranks everything; `settla` is a
            name BankID proved; `bank` is what the statement said.
        emails:
          type: array
          items: {type: string, format: email}
        phones:
          type: array
          description: E.164. Mostly from the app's address-book import.
          items: {type: string}
        destinations:
          type: array
          items:
            type: object
            properties:
              type: {type: string, enum: [iban, bban, bgnr, pgnr, swish]}
              account: {type: [string, "null"], description: Absent for Swish, where the handle is the name.}
              name: {type: [string, "null"]}
        times_paid: {type: integer}
        times_received: {type: integer}
        last_at: {type: [string, "null"], description: Date of the most recent movement, YYYY-MM-DD.}

    DocumentSummary:
      type: object
      required: [id, filename, status, sha256]
      properties:
        id: {type: string}
        filename: {type: string}
        status:
          type: string
          enum: [awaiting_sender, awaiting_parties, signed, declined, expired]
        created_at: {type: string, format: date-time}
        sent_at: {type: [string, "null"], format: date-time}
        expires_at: {type: [string, "null"], format: date-time}
        self_signed: {type: boolean}
        sha256: {type: string}
        final_sha256: {type: [string, "null"]}
        signatures: {type: integer, description: How many have been collected.}
        parties:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              email: {type: string}
              status: {type: string, enum: [pending, signed, declined]}
              name: {type: [string, "null"]}
              signed_at: {type: [string, "null"], format: date-time}

    ApiKey:
      type: object
      required: [id, name, created_at, active]
      description: Never carries the secret or its hash — the shape has no field for them.
      properties:
        id: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, "null"], format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        active: {type: boolean}

    WebhookEvent:
      type: object
      required: [id, type, created_at, data]
      properties:
        id: {type: string}
        type:
          type: string
          enum:
            [payment.signed, payment.executed, payment.declined, payment.expired,
             request.paid, document.signed, checkout.completed]
        created_at: {type: string, format: date-time}
        data:
          type: object
          description: The object the event is about, in the shape this spec gives it.

    # ------------------------------------------------------------- verification
    VerificationMiss:
      type: object
      required: [known, sha256]
      properties:
        known: {type: boolean, const: false}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}

    VerificationHit:
      type: object
      required: [known, sha256, matched, document, evidence_url]
      properties:
        known: {type: boolean, const: true}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        matched:
          type: string
          enum: [original, final]
          description: Whether you sent the file that was signed or the completed one.
        document:
          type: object
          properties:
            filename: {type: string}
            status:
              type: string
              enum: [awaiting_sender, awaiting_parties, signed, declined, expired]
            self_signed: {type: boolean, description: Only one party has signed.}
            original_sha256: {type: string}
            final_sha256: {type: [string, "null"]}
            signatures:
              type: array
              items: {$ref: "#/components/schemas/SignatureResult"}
            seal:
              type: [object, "null"]
              description: |
                A placeholder organisation seal: a detached Ed25519 signature
                over the document hash. Not PAdES, validated by no PDF reader,
                backed by no certificate authority.
              properties:
                algorithm: {type: string}
                at: {type: string, format: date-time}
                valid: {type: boolean}
        seal_note: {type: string, description: The caveat above, in full.}
        evidence_url: {type: string, format: uri}

    SignatureResult:
      type: object
      properties:
        role: {type: string, description: "`sender`, or a party id."}
        name: {type: string}
        at: {type: string, format: date-time}
        personal_number:
          type: string
          description: |
            Masked. Holding the file proves a right to know who signed it, not
            a right to their full identity number.
          examples: ["19790826-****"]
        bankid_issue_date: {type: string}
        manifest_sha256: {type: string}
        covers_prior_signatures:
          type: integer
          description: |
            How many earlier signatures this one commits to. This is what makes
            the order provable and stops a signature being lifted onto another
            document.
        verification:
          type: object
          description: Recomputed from the evidence on every request, not read back from a record.
          properties:
            xmldsig_valid: {type: boolean}
            signed_payload_matches_manifest: {type: boolean}
            certificate:
              type: object
              properties:
                subject: {type: string}
                issuer: {type: string}
                valid_from: {type: string}
                valid_to: {type: string}
            chain:
              type: object
              description: |
                Reported as two separate facts, deliberately. `links_verified`
                is cryptographic. Anchoring to a BankID root is what would make
                it mean something, and this service does not do it — so it is
                never claimed.
              properties:
                length: {type: integer}
                links_verified: {type: boolean}
                terminal_issuer: {type: string}
                terminal_issuer_matches_bankid_root:
                  type: boolean
                  description: A string comparison against BankID's published root name. Not a proof.
                links:
                  type: array
                  items:
                    type: object
                    properties:
                      valid_at_signing: {type: boolean}
            notes:
              type: array
              items: {type: string}
              description: What was not checked. In English, so it can be matched against this spec.

    EvidenceBundle:
      type: object
      description: |
        Everything needed to verify without trusting Settla. See
        github.com/Authenticate-eID-Sweden-AB/settla-signature-verifier.
      properties:
        document_id: {type: string}
        filename: {type: string}
        original_sha256: {type: string}
        final_sha256: {type: [string, "null"]}
        signatures:
          type: array
          items:
            type: object
            properties:
              role: {type: string}
              at: {type: string, format: date-time}
              order_ref: {type: string}
              manifest: {type: string, description: The exact signed payload, as a JSON string.}
              manifest_sha256: {type: string}
              bankid_signature_xmldsig_base64: {type: string}
              ocsp_response_base64: {type: string}
        org_seal: {type: [object, "null"]}
        org_public_key_pem: {type: string}
        how_to_verify:
          type: array
          items: {type: string}
          description: The steps, including the one this service does not perform for you.
        caveat: {type: string}

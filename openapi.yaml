openapi: 3.1.0

# ---------------------------------------------------------------------------
# Settla — public API contract.
#
# STATUS: only the two /api/verify operations are implemented. Everything under
# /v1 is a proposal, marked `x-settla-status: proposed`, and no server will
# answer it today. See README.md.
# ---------------------------------------------------------------------------

info:
  title: Settla API
  version: "2026-08-13"
  summary: Programmatic payments where a human BankID signature is the final word.
  description: |
    Settla never holds money. Payments settle directly from the payer's own bank
    account to the recipient, and no API call can create a Settla balance.

    An API key cannot move money. A key prepares a payment; a person signs it
    with BankID; the signature is the instruction. Every payment therefore moves
    through `created` -> `signed` -> `executed`, and only the bank performs the
    last step.

    Read `x-settla-status` on every operation before integrating. `live` means
    it answers today. `proposed` means the contract is published for comment and
    nothing implements it.
  contact:
    name: Settla
    url: https://github.com/Authenticate-eID-Sweden-AB/settla-api
  license:
    name: Contract published for comment; see README

servers:
  - url: https://test.settla.se
    description: |
      The running portal. Serves the two live verification operations. It is a
      test host, it will change, and it does not serve /v1.

tags:
  - name: Verification
    description: Public, unauthenticated. Holding the file is the entitlement.
  - name: Payments
    description: Prepare payments for a human to sign.
  - name: Payment requests
    description: Ask someone for money. The payer needs no Settla account.
  - name: Checkout
    description: Hosted checkout for merchants.
  - name: Documents
    description: Send a document for signature and read who is outstanding.

security:
  - ApiKey: []

paths:
  # ------------------------------------------------------------- verification
  /api/verify:
    post:
      tags: [Verification]
      operationId: verifyDocument
      x-settla-status: live
      summary: Check whether a PDF is a document Settla holds signatures for
      description: |
        Send the file itself. It is hashed and the hash is looked up; the file is
        not stored. Matching is on the exact bytes, so a re-export or a single
        changed space produces a different hash and no match.

        No authentication. Rate limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/pdf:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: |
            Answered. Note that a file Settla does not recognise is a 200 with
            `known: false`, not a 404 — the question was answered.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VerificationMiss"
                  - $ref: "#/components/schemas/VerificationHit"
        "400": {$ref: "#/components/responses/BadRequest"}
        "413":
          description: The file is larger than the verifier accepts.
        "429": {$ref: "#/components/responses/RateLimited"}

  /api/verify/evidence/{sha256}:
    get:
      tags: [Verification]
      operationId: getEvidenceBundle
      x-settla-status: live
      summary: Download the raw BankID evidence for a document
      description: |
        The material behind a verification result, so it can be checked with
        your own tools instead of believing this service: each signer's XMLDSig,
        the signed manifest, and the OCSP response captured at signing time.

        Keyed on the document hash, so you must hold the file to ask.
      security: []
      parameters:
        - name: sha256
          in: path
          required: true
          description: SHA-256 of the document, lowercase hex.
          schema: {type: string, pattern: "^[0-9a-f]{64}$"}
      responses:
        "200":
          description: The evidence bundle.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EvidenceBundle"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404":
          description: No document with that hash.

  # ----------------------------------------------------------------- payments
  /v1/payments:
    post:
      tags: [Payments]
      operationId: createPayment
      x-settla-status: proposed
      summary: Prepare one payment for signature
      description: |
        Creates a payment in `created` and returns a `sign_url`. Nothing is sent
        to any bank. Give the URL to the person who must sign; they identify
        with BankID, see the recipient, amount and reference, and sign.

        The payer needs no Settla account.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SettlaVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PaymentCreate"}
      responses:
        "201":
          description: Prepared, and waiting for a signature.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Payment"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/IdempotencyConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /v1/payments/batch:
    post:
      tags: [Payments]
      operationId: createPaymentBatch
      x-settla-status: proposed
      summary: Prepare several payments settled under one signature
      description: |
        The batch is what an invoice run wants: one BankID signature covering
        every payment in it. The signature text names each recipient and amount
        and the total, so the signer sees what they are committing to rather
        than a count.

        A batch is all-or-nothing at signing. Individual payments can still fail
        at the bank afterwards, and each carries its own `executed_at`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SettlaVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payments]
              properties:
                payments:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: {$ref: "#/components/schemas/PaymentCreate"}
                signer:
                  $ref: "#/components/schemas/SignerHint"
      responses:
        "201":
          description: Prepared. One `sign_url` covers the batch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentBatch"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /v1/payments/{id}:
    get:
      tags: [Payments]
      operationId: getPayment
      x-settla-status: proposed
      summary: Read a payment's stage
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Payment"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  # --------------------------------------------------------- payment requests
  /v1/payment-requests:
    post:
      tags: [Payment requests]
      operationId: createPaymentRequest
      x-settla-status: proposed
      summary: Ask one or several people for money
      description: |
        A request is a claim, not a transfer. `single` asks one person for one
        amount; `group` splits a total evenly and gives **each participant their
        own link**, deliberately rather than one shared link — with a shared link
        nobody can tell who has paid.

        An optional PDF invoice is shown to the payer as an attachment.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SettlaVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PaymentRequestCreate"}
      responses:
        "201":
          description: Created, with a pay link per participant.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentRequest"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /v1/payment-requests/{id}:
    get:
      tags: [Payment requests]
      operationId: getPaymentRequest
      x-settla-status: proposed
      summary: Read who has paid and who has not
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The request, with per-participant status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ----------------------------------------------------------------- checkout
  /v1/checkout/sessions:
    post:
      tags: [Checkout]
      operationId: createCheckoutSession
      x-settla-status: proposed
      summary: Hand a customer to Settla's hosted checkout
      description: |
        The customer is redirected to `checkout_url`, identifies with BankID,
        pays, and is returned to `return_url`.

        If you ask for a delivery address, the customer must consent to
        releasing it **for that transaction**; it is personal data, and a silent
        prefill is not consent. A session where consent was refused completes
        the payment and returns no address.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SettlaVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckoutSessionCreate"}
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckoutSession"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  # ---------------------------------------------------------------- documents
  /v1/documents:
    post:
      tags: [Documents]
      operationId: createDocument
      x-settla-status: proposed
      summary: Send a document for signature
      description: |
        Upload a PDF and name who must sign it. Each counterparty gets a link;
        they identify with BankID **before** the document is shown, so a
        forwarded link does not expose the contents.

        Each signature produces an evidence bundle retrievable through
        `GET /api/verify/evidence/{sha256}`, which is live today.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SettlaVersion"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, parties]
              properties:
                file: {type: string, format: binary}
                parties:
                  type: string
                  description: JSON array of `{name, email}`, in signing order.
      responses:
        "201":
          description: Created and sent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Document"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /v1/documents/{id}:
    get:
      tags: [Documents]
      operationId: getDocument
      x-settla-status: proposed
      summary: Read who has signed and who is outstanding
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Document"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

# ---------------------------------------------------------------------- hooks
webhooks:
  paymentSigned:
    post:
      x-settla-status: proposed
      summary: A person signed a payment. No money has moved yet.
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebhookEvent"}
      responses:
        "200": {description: Acknowledged. Anything else is retried.}
  paymentExecuted:
    post:
      x-settla-status: proposed
      summary: The bank settled the payment. This is the only event that means money moved.
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebhookEvent"}
      responses:
        "200": {description: Acknowledged.}

components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: sk_live_…
      description: |
        Created in the Settla portal and shown once. A key acts for exactly one
        account and sees nothing outside it. A key cannot move money: everything
        it creates waits for a human BankID signature.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every creating request. Replaying the same key returns the
        original object instead of creating a second one. This is what makes an
        agent's retry loop safe.
      schema: {type: string, maxLength: 255}
    SettlaVersion:
      name: Settla-Version
      in: header
      required: false
      description: The dated contract version this integration was written against.
      schema: {type: string, example: "2026-08-13"}

  responses:
    BadRequest:
      description: The request could not be read.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing, unknown or revoked key.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: No such object on this key's account.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    IdempotencyConflict:
      description: The same Idempotency-Key was used with a different body.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ValidationFailed:
      description: |
        The request was understood and rejected — a failed OCR check digit, an
        IBAN that fails mod-97, a bankaccount recipient with no name.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: Too many attempts from this address.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string, description: A stable machine-readable code.}
        message: {type: string, description: What went wrong, in English.}
        field: {type: string, description: The offending field, where there is one.}

    Amount:
      type: string
      pattern: "^[0-9]+\\.[0-9]{2}$"
      description: |
        A decimal string with exactly two places — never a float, never öre as
        an integer. Floats lose money in the last place and integers get
        misread as kronor.
      examples: ["7031.00", "1010.56"]

    Currency:
      type: string
      pattern: "^[A-Z]{3}$"
      description: ISO 4217. Both SEK and foreign-currency invoices occur.
      examples: ["SEK", "EUR"]

    Recipient:
      type: object
      description: |
        One of four kinds. `bankgiro` and `plusgiro` are looked up in the giro
        registers, so no name is needed. `bankaccount` has no register behind it
        and therefore requires `name`. `iban` is EUR within the EU/EEA.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [bankgiro, plusgiro, bankaccount, iban]
        number:
          type: string
          description: |
            The giro number (`5099-2429`), the IBAN
            (`LT643250090327964206`), or the account number when
            `kind: bankaccount`. Separators are ignored.
        clearing:
          type: string
          description: "Required when `kind: bankaccount`."
        name:
          type: string
          description: |
            Required when `kind: bankaccount`, because nothing can be looked up.
            Ignored for the giro kinds, where the register is authoritative.
      examples:
        - {kind: bankgiro, number: "5099-2429"}
        - {kind: iban, number: "LT643250090327964206"}
        - {kind: bankaccount, clearing: "8327-9", number: "64206", name: "Millar Konsult AB"}

    Reference:
      type: object
      description: An OCR number or a free-text message. Many invoices have neither.
      properties:
        ocr:
          type: string
          description: |
            Validated with a Luhn check and, where the invoice states one, a
            length check. A failing OCR is rejected rather than sent — the bank
            would reject it later, after the signature.
          examples: ["1234567897"]
        message:
          type: string
          maxLength: 140

    SignerHint:
      type: object
      description: |
        Who you expect to sign. Optional: anyone holding the `sign_url` and a
        BankID may sign, and the signature records who actually did. Supplying
        it lets Settla mail the link and lets you detect a mismatch.
      properties:
        name: {type: string}
        email: {type: string, format: email}
        personal_number:
          type: string
          description: 12 digits. Stored and returned masked.
          examples: ["197908261234"]

    PaymentStatus:
      type: string
      enum: [created, signed, executed, declined, expired, failed]
      description: |
        `signed` means a person signed the authorisation. It does **not** mean
        money moved; only `executed` does, and only the bank sets it.

    PaymentCreate:
      type: object
      required: [recipient, amount, currency]
      properties:
        recipient: {$ref: "#/components/schemas/Recipient"}
        amount: {$ref: "#/components/schemas/Amount"}
        currency: {$ref: "#/components/schemas/Currency"}
        reference: {$ref: "#/components/schemas/Reference"}
        due_date: {type: string, format: date}
        signer: {$ref: "#/components/schemas/SignerHint"}
        attachment_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: An invoice already uploaded, shown to the signer.
        metadata:
          type: object
          additionalProperties: {type: string}
          description: Your own identifiers, returned unchanged. Never shown to the payer.

    Payment:
      allOf:
        - $ref: "#/components/schemas/PaymentCreate"
        - type: object
          required: [id, status, sign_url, created_at]
          properties:
            id: {type: string}
            status: {$ref: "#/components/schemas/PaymentStatus"}
            sign_url:
              type: string
              format: uri
              description: Where a person signs. Give it to them; do not open it yourself.
            created_at: {type: string, format: date-time}
            signed_at:
              type: [string, "null"]
              format: date-time
            executed_at:
              type: [string, "null"]
              format: date-time
              description: |
                Set only when the bank has settled. Null on a signed payment,
                and the field to reconcile against — not `signed_at`.
            signed_by:
              type: object
              description: Who actually signed, from BankID. Absent until signed.
              properties:
                name: {type: string}
                personal_number: {type: string, examples: ["19790826-****"]}
            evidence_url:
              type: [string, "null"]
              format: uri
            decline_reason: {type: [string, "null"]}

    PaymentBatch:
      type: object
      required: [id, status, sign_url, payments]
      properties:
        id: {type: string}
        status: {$ref: "#/components/schemas/PaymentStatus"}
        sign_url: {type: string, format: uri, description: One signature covers every payment.}
        total: {$ref: "#/components/schemas/Amount"}
        currency: {$ref: "#/components/schemas/Currency"}
        payments:
          type: array
          items: {$ref: "#/components/schemas/Payment"}

    PaymentRequestCreate:
      type: object
      required: [kind, total, currency]
      properties:
        kind: {type: string, enum: [single, group]}
        total: {$ref: "#/components/schemas/Amount"}
        currency: {$ref: "#/components/schemas/Currency"}
        message: {type: string, maxLength: 500}
        participants:
          type: array
          minItems: 1
          description: |
            One for `single`. For `group` the total is split evenly across them,
            with any remainder distributed a öre at a time rather than dropped.
          items:
            type: object
            properties:
              name: {type: string}
              email: {type: string, format: email}
              amount:
                $ref: "#/components/schemas/Amount"
                description: Overrides the even split for this participant.
        attachment_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}

    PaymentRequest:
      allOf:
        - $ref: "#/components/schemas/PaymentRequestCreate"
        - type: object
          required: [id, created_at, participants]
          properties:
            id: {type: string}
            created_at: {type: string, format: date-time}
            outstanding:
              $ref: "#/components/schemas/Amount"
              description: What is still unpaid across every participant.
            participants:
              type: array
              items:
                type: object
                properties:
                  id: {type: string}
                  name: {type: string}
                  email: {type: string, format: email}
                  amount: {$ref: "#/components/schemas/Amount"}
                  status: {type: string, enum: [pending, paid, declined]}
                  pay_url:
                    type: string
                    format: uri
                    description: This participant's own link. Not shared with the others.
                  paid_at: {type: [string, "null"], format: date-time}

    CheckoutSessionCreate:
      type: object
      required: [amount, currency, return_url]
      properties:
        amount: {$ref: "#/components/schemas/Amount"}
        currency: {$ref: "#/components/schemas/Currency"}
        reference: {$ref: "#/components/schemas/Reference"}
        return_url:
          type: string
          format: uri
          description: Where the customer is sent afterwards, paid or not.
        merchant_name:
          type: string
          description: Shown to the customer so they know whose checkout they are in.
        collect_address:
          type: boolean
          default: false
          description: |
            Ask for a delivery address. The customer must consent per
            transaction; refusing does not block the payment, it withholds the
            address.
        metadata:
          type: object
          additionalProperties: {type: string}

    CheckoutSession:
      allOf:
        - $ref: "#/components/schemas/CheckoutSessionCreate"
        - type: object
          required: [id, checkout_url, status]
          properties:
            id: {type: string}
            checkout_url: {type: string, format: uri}
            status: {type: string, enum: [open, completed, abandoned, expired]}
            payment: {$ref: "#/components/schemas/Payment"}
            customer:
              type: object
              description: Present only where the customer consented to release it.
              properties:
                name: {type: string}
                personal_number: {type: string, examples: ["19790826-****"]}
                address:
                  type: object
                  properties:
                    street: {type: string}
                    postal_code: {type: string}
                    city: {type: string}

    Document:
      type: object
      required: [id, filename, status, sha256, parties]
      properties:
        id: {type: string}
        filename: {type: string}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        status:
          type: string
          enum: [awaiting_sender, awaiting_parties, signed, declined, expired]
        final_sha256:
          type: [string, "null"]
          description: The completed file with its signature page, once everyone has signed.
        parties:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              email: {type: string, format: email}
              status: {type: string, enum: [pending, signed, declined]}
              sign_url: {type: string, format: uri}
              signed_at: {type: [string, "null"], format: date-time}
        evidence_url: {type: [string, "null"], format: uri}

    WebhookEvent:
      type: object
      required: [id, type, created_at, data]
      properties:
        id: {type: string}
        type:
          type: string
          enum:
            [payment.signed, payment.executed, payment.declined, payment.expired,
             request.paid, document.signed, checkout.completed]
        created_at: {type: string, format: date-time}
        data:
          type: object
          description: The object the event is about, in the shape this spec gives it.

    # ------------------------------------------------------------- verification
    VerificationMiss:
      type: object
      required: [known, sha256]
      properties:
        known: {type: boolean, const: false}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}

    VerificationHit:
      type: object
      required: [known, sha256, matched, document, evidence_url]
      properties:
        known: {type: boolean, const: true}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        matched:
          type: string
          enum: [original, final]
          description: Whether you sent the file that was signed or the completed one.
        document:
          type: object
          properties:
            filename: {type: string}
            status:
              type: string
              enum: [awaiting_sender, awaiting_parties, signed, declined, expired]
            self_signed: {type: boolean, description: Only one party has signed.}
            original_sha256: {type: string}
            final_sha256: {type: [string, "null"]}
            signatures:
              type: array
              items: {$ref: "#/components/schemas/SignatureResult"}
            seal:
              type: [object, "null"]
              description: |
                A placeholder organisation seal: a detached Ed25519 signature
                over the document hash. Not PAdES, validated by no PDF reader,
                backed by no certificate authority.
              properties:
                algorithm: {type: string}
                at: {type: string, format: date-time}
                valid: {type: boolean}
        seal_note: {type: string, description: The caveat above, in full.}
        evidence_url: {type: string, format: uri}

    SignatureResult:
      type: object
      properties:
        role: {type: string, description: "`sender`, or a party id."}
        name: {type: string}
        at: {type: string, format: date-time}
        personal_number:
          type: string
          description: |
            Masked. Holding the file proves a right to know who signed it, not
            a right to their full identity number.
          examples: ["19790826-****"]
        bankid_issue_date: {type: string}
        manifest_sha256: {type: string}
        covers_prior_signatures:
          type: integer
          description: |
            How many earlier signatures this one commits to. This is what makes
            the order provable and stops a signature being lifted onto another
            document.
        verification:
          type: object
          description: Recomputed from the evidence on every request, not read back from a record.
          properties:
            xmldsig_valid: {type: boolean}
            signed_payload_matches_manifest: {type: boolean}
            certificate:
              type: object
              properties:
                subject: {type: string}
                issuer: {type: string}
                valid_from: {type: string}
                valid_to: {type: string}
            chain:
              type: object
              description: |
                Reported as two separate facts, deliberately. `links_verified`
                is cryptographic. Anchoring to a BankID root is what would make
                it mean something, and this service does not do it — so it is
                never claimed.
              properties:
                length: {type: integer}
                links_verified: {type: boolean}
                terminal_issuer: {type: string}
                terminal_issuer_matches_bankid_root:
                  type: boolean
                  description: A string comparison against BankID's published root name. Not a proof.
                links:
                  type: array
                  items:
                    type: object
                    properties:
                      valid_at_signing: {type: boolean}
            notes:
              type: array
              items: {type: string}
              description: What was not checked. In English, so it can be matched against this spec.

    EvidenceBundle:
      type: object
      description: |
        Everything needed to verify without trusting Settla. See
        github.com/Authenticate-eID-Sweden-AB/settla-signature-verifier.
      properties:
        document_id: {type: string}
        filename: {type: string}
        original_sha256: {type: string}
        final_sha256: {type: [string, "null"]}
        signatures:
          type: array
          items:
            type: object
            properties:
              role: {type: string}
              at: {type: string, format: date-time}
              order_ref: {type: string}
              manifest: {type: string, description: The exact signed payload, as a JSON string.}
              manifest_sha256: {type: string}
              bankid_signature_xmldsig_base64: {type: string}
              ocsp_response_base64: {type: string}
        org_seal: {type: [object, "null"]}
        org_public_key_pem: {type: string}
        how_to_verify:
          type: array
          items: {type: string}
          description: The steps, including the one this service does not perform for you.
        caveat: {type: string}
